plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nexos.tubemusic'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nexos.tubemusic'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // Solo ABIs de teléfonos reales: recorta el peso de FFmpeg a la mitad.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // NewPipeExtractor lo exige con minSdk < 33.
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.27.1'
    // Conversion a MP3 (libmp3lame). Fork mantenido de FFmpegKit (arthenica retirado).
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-audio:8.1.9'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    testImplementation 'junit:junit:4.13.2'
}
